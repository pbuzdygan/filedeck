# Filedeck. Settings: copy .env.example to .env.
# Host directories (e.g. SMB/NFS mounts already configured on the server) are
# added in compose.override.yaml - see compose.override.example.yaml.
name: filedeck
services:
  filedeck:
    build: .
    image: filedeck:local
    restart: unless-stopped
    # UID:GID the process runs as; must be able to write the mapped directories.
    user: "${FILEDECK_USER:-65532:65532}"
    environment:
      # Exactly the address typed in the browser (scheme, host, port).
      FILEDECK_ORIGIN: "${FILEDECK_ORIGIN:-https://localhost:${FILEDECK_PORT:-8443}}"
      FILEDECK_TLS_SELF_SIGNED: "${FILEDECK_TLS_SELF_SIGNED:-true}"
      FILEDECK_PROXY_CIDR: "${FILEDECK_PROXY_CIDR:-}"
      # Modes of files and folders created through Filedeck (octal).
      FILEDECK_FILE_MODE: "${FILEDECK_FILE_MODE:-0640}"
      FILEDECK_DIR_MODE: "${FILEDECK_DIR_MODE:-0750}"
    ports:
      - "${FILEDECK_BIND:-127.0.0.1}:${FILEDECK_PORT:-8443}:8443"
    volumes:
      - filedeck-data:/data     # application state: accounts, sessions, certificate
      - filedeck-files:/files   # own space "Moje pliki"
      - docker_dev:/spaces/docker_dev   # every /spaces/<name> becomes a space
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    stop_grace_period: 30s

volumes:
  filedeck-data:
  filedeck-files:
  docker_dev:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/buzsys/github